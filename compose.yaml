services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: botton
      MYSQL_USER: botton
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD no arquivo .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u botton -D botton -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/botton
      DB_USER: botton
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
